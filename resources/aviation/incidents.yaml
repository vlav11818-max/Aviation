incidents:
- name: US Airways 1549 — "Miracle on the Hudson"
  section: MIRACLE LANDINGS / IMPOSSIBLE SAVES
  date: 15 January 2009
  aircraft: Airbus A320-214 (N106US)
  location: Hudson River, New York City
  failure_type: Dual engine bird strike (Canada geese) на высоте ~2,800 ft через 3 min after takeoff of LGA
  outcome: successful landing на воду (ditching) в реке Гудзон
  casualties: 0 fatalities of 155 onboard; несколько serious injuries
  dramatic_details:
  - 'Cпокойная фраза Sullenberger в ATC: "we''re gonna be in the Hudson" — до сих пор используется as эталон CRM'
  - От бёрд страйка до touchdown воды прошло about 3.5 min
  - first officer Skiles до the last пытался restart engines along QRH
  - Sully дважды went along салону после landing, проверяя, all ли вышли
  - Ferry captain Vince Lombardi первым подошёл — гражданские суда rescued passengers быстрее МЧС
  sub_genre_primary: Miracle emergency landing
  sub_genre_secondary: ''
  causation_type: Bird-Strike
  aircraft_type: Narrow-body commercial
  setting_layer2: Winter storm zone
  setting_geographic: Hudson River, urban New York
  monetization_risk: LOW
  twist_potential: Каждый passenger получил через год письмо с приглашением на воссоединение, ставшее ежегодным ритуалом
  sources:
  - NTSB Report AAR-10/03
  - Aviation Safety Network — asndb / N106US
  - Sullenberger memoir "Highest Duty"
  translation_status: partial
- name: Air Canada 143 — "Gimli Glider"
  section: MIRACLE LANDINGS / IMPOSSIBLE SAVES
  date: 23 July 1983
  aircraft: Boeing 767-233 (C-GAUN)
  location: Gimli, Manitoba, Canada
  failure_type: Fuel exhaustion на FL410 — при refueling confused фунты and килограммы (Канада only переходила на метрическую систему)
  outcome: Dead-stick landing на бывшем военном the airfield, превращённом в трек для гонок
  casualties: 0 of 69; несколько minor injuries during evacuation
  dramatic_details:
  - Первым failed левый engine, через ~2 min — правый; электрика fell на резервный RAT (ram air turbine)
  - captain Bob Pearson был опытным планеристом — использовал forward slip, rarely применяемый на airliners, so that сбросить высоту
  - На landing runway шли гонки семейного автоклуба Winnipeg Sports Car Club — люди стояли прямо на runway
  - nose gear не выпустилась completely — aircraft скользил на носу, that помогло затормозить
  - Ф/О Maurice Quintal вспомнил про Gimli of своей военной службы — гражданские карты этот airfield already не показывали
  sub_genre_primary: Miracle emergency landing
  sub_genre_secondary: ''
  causation_type: Fuel + Human-Factor
  aircraft_type: Wide-body commercial
  setting_layer2: N/A (нет прямого маппинга в Layer 2 ОСЬ 4)
  setting_geographic: Rural Manitoba, abandoned airfield
  monetization_risk: LOW
  twist_potential: The same airframe went on to fly 25 years под прозвищем "Gimli Glider"; was retired в 2008, sold в пустыню Мохаве
  sources:
  - 'Wikipedia: Gimli Glider (детально)'
  - Admiral Cloudberg archive
  - CBC archives
  translation_status: partial
- name: Air Transat 236 — Azores Glider
  section: MIRACLE LANDINGS / IMPOSSIBLE SAVES
  date: 24 August 2001
  aircraft: Airbus A330-243 (C-GITS)
  location: Lajes Airbase, Azores, Atlantic
  failure_type: leak fuel из-за неправильно установленного hydraulic насоса при maintenance; crew перекачал остаток fuel в течь
  outcome: Планировали 120 км без engines, landing на Лажесе; шины burst, 8 of 10 сдулись
  casualties: 0 of 306; 16 serious injuries during evacuation
  dramatic_details:
  - world record планирования гражданского реактивного aircraft — 19 min without thrust
  - crew поначалу считал testimony fuel ошибочными; when включили cross-feed, ускорили the leak
  - Португальские F-16 сопровождали approach, but не потребовались
  - passengers молились вслух в салоне; cabin crew раздавали инструкции along позе для brace
  - captain Robert Piché — бывший преступник (наркоконтрабанда в 1980-х), после отсидки стал пилотом
  sub_genre_primary: Miracle emergency landing
  sub_genre_secondary: ''
  causation_type: Fuel + Maintenance
  aircraft_type: Wide-body commercial
  setting_layer2: Islands & oceanic
  setting_geographic: Azores, mid-Atlantic
  monetization_risk: LOW
  twist_potential: 'Прошлое captain делает арку redemption; фильм "Piché: entre ciel et terre" (2010)'
  sources:
  - Portuguese GPIAA final report
  - Admiral Cloudberg
  - Aviation Safety Network
  translation_status: partial
- name: British Airways 9 — "Speedbird 9"
  section: MIRACLE LANDINGS / IMPOSSIBLE SAVES
  date: 24 June 1982
  aircraft: Boeing 747-236B (G-BDXH "City of Edinburgh")
  location: Ночной полёт над Индонезией, Индийский океан
  failure_type: all 4 engine flamed out из-за вулканического ash (извержение Galunggung); ash плавился в турбинах and налипал на лопатки
  outcome: 14 min without thrust, спуск до 12,000 ft, engines последовательно restarted; landing в Джакарте с повреждённым лобовым стеклом
  casualties: 0 of 263
  dramatic_details:
  - legendary объявление captain Eric Moody пассажирам — паззажирам сказали "small problem — all four engines have stopped" в максимально уравновешенной манере
  - passengers видели зелёное свечение (St. Elmo's fire) вокруг engines до failure
  - windshield было настолько исцарапано пеплом, that were on approach визуально сбоку через боковое окно
  - then никто не знал о риске вулканического ash для реактивных engines — событие изменило регуляции
  - crew не идентифицировал volcano; ATC долго не верили, that all 4 движка failed
  sub_genre_primary: Miracle emergency landing
  sub_genre_secondary: Weather disaster & near-miss
  causation_type: Weather (volcanic) + Mechanical
  aircraft_type: Wide-body commercial
  setting_layer2: Volcanic region
  setting_geographic: Indian Ocean near Indonesia
  monetization_risk: LOW
  twist_potential: Событие породило VAAC (Volcanic Ash Advisory Centers) worldwide
  sources:
  - UK AAIB Bulletin 8/82
  - Mentour Pilot detailed video
  - Eric Moody interviews
  translation_status: partial
- name: TACA 110 — "Miracle on the Levee"
  section: MIRACLE LANDINGS / IMPOSSIBLE SAVES
  date: 24 May 1988
  aircraft: Boeing 737-300 (N75356) — почти новый, месяцы в эксплуатации
  location: Дамба возле NASA Michoud, New Orleans, Louisiana
  failure_type: Двойной flameout после прохождения thunderstorm с градом при the descent на idle power; на 16,500 ft both CFM56 залило водой
  outcome: Dead-stick landing на узкой травяной дамбе; после ремонта aircraft улетел с 6,000-футовой заводской "полосы"
  casualties: 0 of 45; лёгкие травмы
  dramatic_details:
  - captain Carlos Dárdano — 29 years, flew с одним глазом (lost в civil war в Сальвадоре)
  - APU restarted электрику, движки зафлеймовались again, but не давали больше idle thrust
  - Дардано выбрал дамбу шириной с wing aircraft возле промышленной зоны
  - 'Пассажирка вспоминала: думала, that already сели в the airport — так мягко получилось'
  - The incident rewrote the standards сертификации engines along устойчивости к воде and граду
  sub_genre_primary: Miracle emergency landing
  sub_genre_secondary: ''
  causation_type: Weather (hail/storm) + Mechanical
  aircraft_type: Narrow-body commercial
  setting_layer2: Tropical storm / typhoon
  setting_geographic: Gulf coast Louisiana, industrial
  monetization_risk: LOW
  twist_potential: The same airframe flew в Southwest Airlines до 2016 years; was scrapped only через 28 years
  sources:
  - NTSB Docket FTW88IA109
  - 'FAA Lessons Learned: N75356'
  - Admiral Cloudberg archive
  translation_status: partial
- name: United 232 — Sioux City
  section: MIRACLE LANDINGS / IMPOSSIBLE SAVES
  date: 19 July 1989
  aircraft: McDonnell Douglas DC-10-10 (N1819U)
  location: Sioux Gateway Airport, Iowa
  failure_type: uncontained failure engine №2 (хвостовой) — fan disc ruptured, осколки перебили all три hydraulic systems одновременно (событие с вероятностью 1:1,000,000,000)
  outcome: Управление одной тягой two оставшихся движков; жёсткая landing, aircraft развалился на несколько частей
  casualties: 111 fatalities of 296; 185 survivors (включая младенца, which was found alive в шкафу для багажа)
  dramatic_details:
  - captain Al Haynes and check pilot Denny Fitch (случайный passenger) управляли asymmetric thrust — Fitch стоял на коленях между кресел, работая с throttles
  - crew не мог поворачивать, снижать or менять конфигурацию нормально — only просить у Sioux City "runway побольше"
  - ATC-диалог с Кевином Бахманом стал классикой — эталон профессионализма под давлением
  - В симуляторах после происшествия ни один crew не was able to повторить landing 232-го
  - Fitch died от рака мозга в 2012; Haynes died в 2019 — both до конца lives говорили о происшествии
  sub_genre_primary: Miracle emergency landing
  sub_genre_secondary: Mechanical failure recreation
  causation_type: Mechanical + Structural
  aircraft_type: Wide-body commercial
  setting_layer2: N/A (нет прямого маппинга в Layer 2 ОСЬ 4)
  setting_geographic: Rural Iowa, Sioux City
  monetization_risk: LOW
  twist_potential: 185 of 296 выжили в crash, где along всем моделям должны были погибнуть all — CRM and удача
  sources:
  - NTSB Report AAR-90/06
  - Denny Fitch documentaries
  - Al Haynes NASA lecture (public domain)
  translation_status: partial
- name: Qantas 32 — Uncontained A380
  section: MIRACLE LANDINGS / IMPOSSIBLE SAVES
  date: 4 November 2010
  aircraft: Airbus A380-842 (VH-OQA "Nancy-Bird Walton")
  location: Batam Island, Indonesia (после взлёта из Сингапура)
  failure_type: Uncontained failure Rolls-Royce Trent 900 №2 — треснул intermediate pressure turbine disc из-за брака масляной трубки; шрапнель прошила wing
  outcome: crew 2 h разбирался с 130+ ECAM сообщениями; landing в Changi, шины перегреты, fuel течёт
  casualties: 0 of 469
  dramatic_details:
  - 'captain Richard de Crespigny описал звук: громче любого симулятора, "obvious engine failure" — but это оказалось намного хуже'
  - Осколки пробили wing, разорвали электрику, fuel, гидравлику — almost каждая система дала сбой
  - В кабине было 5 пилотов (тренировочный flight), that помогло справиться с нагрузкой
  - engine №1 после landing не глушился 3 h — заливали водой снаружи
  - wreckage fell на дома в Batam, Индонезия — никто не пострадал
  sub_genre_primary: Miracle emergency landing
  sub_genre_secondary: Mechanical failure recreation
  causation_type: Mechanical (uncontained engine)
  aircraft_type: Wide-body commercial
  setting_layer2: N/A (нет прямого маппинга в Layer 2 ОСЬ 4)
  setting_geographic: Batam / Singapore, urban debris field
  monetization_risk: LOW
  twist_potential: Redundancy A380 (4 движка, дублированная hydraulics) буквально спасла lives; книга de Crespigny "QF32"
  sources:
  - ATSB Report AO-2010-089
  - FAA Lessons Learned
  - 'Admiral Cloudberg: "A Matter of Millimeters"'
  translation_status: partial
- name: British Airways 5390 — "Captain Sucked Out"
  section: MIRACLE LANDINGS / IMPOSSIBLE SAVES
  date: 10 June 1990
  aircraft: BAC One-Eleven 528FL (G-BJRT)
  location: Над Оксфордширом, Англия
  failure_type: Взорвалось левое windshield на 17,300 ft из-за неправильных болтов при замене (использовали слишком мелкие); captain Tim Lancaster partially высосало наружу
  outcome: Ф/О Alastair Atchison посадил aircraft в Southampton; стюард Nigel Ogden держал Ланкастера за ноги 20 min
  casualties: 0 of 87; captain survived с обморожениями and переломами
  dramatic_details:
  - windshield установил инженер, использовавший болты на 0.66 мм меньше требуемого диаметра — на глаз
  - Тело Ланкастера прижало к fuselage; crew думал, that он мёртв, but продолжал держать
  - Ф/О пилотировал через кричащий wind, не слыша ATC
  - captain вернулся к полётам через 5 месяцев
  - incident лёг в основу the first сезона "Air Crash Investigation"
  sub_genre_primary: Cabin crisis
  sub_genre_secondary: Miracle emergency landing
  causation_type: Maintenance + Structural
  aircraft_type: Narrow-body commercial
  setting_layer2: N/A (нет прямого маппинга в Layer 2 ОСЬ 4)
  setting_geographic: Southern England, high altitude
  monetization_risk: LOW
  twist_potential: Physical horror — people висит снаружи 20 min and выживает
  sources:
  - UK AAIB Report 1/92
  - BBC archives
  - ACI Season 1 Episode
  translation_status: partial
- name: Aloha Airlines 243 — "Convertible 737"
  section: MIRACLE LANDINGS / IMPOSSIBLE SAVES
  date: 28 April 1988
  aircraft: Boeing 737-297 (N73711)
  location: Над Гавайями, посадка в Kahului, Maui
  failure_type: Explosive decompression — 5.5 метров верхней части fuselage сорвало из-за металлической усталости and коррозии (частые короткие рейсы над солёной атмосферой)
  outcome: crew посадил aircraft с открытым верхом за 13 min
  casualties: 1 погибшая (flight attendant CB Lansing, высосало), 65 раненых of 95
  dramatic_details:
  - passengers видели небо and пилотов сквозь дыру в потолке
  - captain Robert Schornstheimer с ф/о Madeline Tompkins сажали aircraft без лобовой перегородки — воздушный поток чуть не выдувал их
  - 89,000 циклов landing на этом борту — рекорд для типа
  - Один of движков позже failed на подходе — сажали фактически на одном
  - incident запустил новую программу — Aging Aircraft Program
  sub_genre_primary: Miracle emergency landing
  sub_genre_secondary: Cabin crisis
  causation_type: Structural + Maintenance (metal fatigue)
  aircraft_type: Narrow-body commercial
  setting_layer2: Islands & oceanic
  setting_geographic: Hawaii inter-island
  monetization_risk: LOW
  twist_potential: Визуальный шок — 737 без верхней части fuselage в воздухе
  sources:
  - NTSB Report AAR-89/03
  - Boeing service history
  - ACI recreation
  translation_status: partial
- name: LOT Flight 16 — Gear-up 787 landing
  section: MIRACLE LANDINGS / IMPOSSIBLE SAVES
  date: 1 November 2011
  aircraft: 'Boeing 767-35DER (SP-LPC) — прим.: это был 767, не 787'
  location: Warsaw Chopin Airport
  failure_type: Полный failure гидравлической системы центральной шины; landing gear не выпустились; при manual gravity extension предохранитель был выдвинут (случайно)
  outcome: landing на брюхо в Варшаве, aircraft сгруппирован along осевой линии полосы
  casualties: 0 of 231
  dramatic_details:
  - captain Tadeusz Wrona (Wrona = "ворона" along-польски) стал национальным героем
  - crew кружил над Варшавой ~1 h, вырабатывая fuel
  - landing была настолько идеальной, that aircraft stopped along центру полосы без fire
  - Один passenger снимал происходящее на камеру — стал документальным материалом
  - 'Wrona: планирист-любитель, вернулся к полётам через несколько месяцев'
  sub_genre_primary: Miracle emergency landing
  sub_genre_secondary: ''
  causation_type: Mechanical + Human-Factor (breaker)
  aircraft_type: Wide-body commercial
  setting_layer2: N/A (нет прямого маппинга в Layer 2 ОСЬ 4)
  setting_geographic: Warsaw, urban approach
  monetization_risk: LOW
  twist_potential: Национальный герой + "ворона" в фамилии
  sources:
  - Polish PKBWL report
  - Reuters coverage
  - LOT press releases
  translation_status: partial
- name: Air Astana 1388 — "Flying the Unflyable Plane"
  section: MIRACLE LANDINGS / IMPOSSIBLE SAVES
  date: 11 November 2018
  aircraft: Embraer ERJ-190LR (P4-KCJ)
  location: Beja Airbase, Portugal (диверт с Alverca)
  failure_type: Инженеры OGMA неправильно установили тросы элеронов после ТО — соединения перевёрнуты; крен работал наоборот
  outcome: 90-минутный кошмар со случайными переворотами and пикированиями; landing на военной базе с помощью F-16
  casualties: 0 of 6 (перегоночный flight)
  dramatic_details:
  - aircraft несколько раз переворачивался на спину; crew выдерживал большие перегрузки
  - crew запросил визуальный flight на восток, so that найти условия для landing
  - Два португальских F-16 сопровождали and наводили; crew просил F-16 отойти — сработал TCAS
  - first approach прерван — aircraft слишком дикий; сели со second попытки
  - investigation показало, that service bulletin Embraer требовал снимать both троса одновременно, that нарушало принцип защиты от ошибки
  sub_genre_primary: Miracle emergency landing
  sub_genre_secondary: Mechanical failure recreation
  causation_type: Maintenance (mis-installed control cables)
  aircraft_type: Regional jet
  setting_layer2: Coastal / ocean approach
  setting_geographic: Portuguese coast, Beja
  monetization_risk: LOW
  twist_potential: Военный эскорт F-16 добавляет визуал; rarely освещённая история в западных YouTube
  sources:
  - Portuguese GPIAAF final report
  - Admiral Cloudberg archive
  - Fear of Landing
  translation_status: partial
- name: British Airways 38 — Heathrow Threshold
  section: DISASTER-LESSONS / TECHNICAL FAILURES
  date: 17 January 2008
  aircraft: Boeing 777-236ER (G-YMMM)
  location: Heathrow Airport, London
  failure_type: Ice crystals в топливе заблокировали Fuel-Oil Heat Exchangers both движков Rolls-Royce Trent 800 — потеря thrust на финальной прямой на 720 ft
  outcome: Аварийная landing не долетев ~270 метров до полосы; landing gear сложились, airframe разрушен, but интактен
  casualties: 0 of 152, 1 серьёзная травма (passenger с переломом ноги)
  dramatic_details:
  - first hull-loss Boeing 777 в истории (после 13 years службы типа)
  - crew (captain Peter Burkill, ф/о John Coward) имел ~30 sec от failure thrust до земли
  - Coward, летевший при заходе, raised nose — минимизировал жёсткость удара
  - 'Условия flight of Пекина: температура fuel достигала –34°C'
  - FAA / EASA потребовали изменить конструкцию FOHE после incident
  sub_genre_primary: Miracle emergency landing
  sub_genre_secondary: ''
  causation_type: Fuel (ice) + Mechanical
  aircraft_type: Wide-body commercial
  setting_layer2: Winter storm zone
  setting_geographic: London Heathrow threshold
  monetization_risk: LOW
  twist_potential: Условия совпали идеально — цепочка редчайших факторов; технический triller
  sources:
  - UK AAIB Report 1/2010
  - Admiral Cloudberg
  - Peter Burkill memoir
  translation_status: partial
- name: JAL 123 — Deadliest Single-Aircraft Disaster
  section: DISASTER-LESSONS / TECHNICAL FAILURES
  date: 12 August 1985
  aircraft: Boeing 747SR-46 (JA8119)
  location: Гора Осутака, префектура Гумма, Япония
  failure_type: Взорвалась задняя гермопереборка (неправильный ремонт Boeing 7 years назад — одинарный ряд заклёпок вместо двойного); хвостовой обтекатель сорвало, all 4 hydraulic systems разорваны
  outcome: 32 min неуправляемого flight only через тягу engines; struck в горы
  casualties: 520 fatalities of 524; 4 survivors (all женщины and девочки)
  dramatic_details:
  - Некоторые passengers писали прощальные записки семьям — 8 записок были найдены на месте
  - crew (captain Masami Takahama) боролся 32 min — редкий case, when crew настолько долго удерживает разрушенный aircraft
  - Японская армия отклонила предложение США о немедленной помощи; спасатели прибыли only утром
  - Одна of survivors, Yumi Ochiai, была бортпроводницей, летевшей пассажиром
  - Инженер Boeing, ответственный за ремонт, покончил с собой; президент JAL ушёл в отставку
  sub_genre_primary: Mechanical failure recreation
  sub_genre_secondary: Search & rescue operation
  causation_type: Structural + Maintenance
  aircraft_type: Wide-body commercial
  setting_layer2: Mountain airport
  setting_geographic: Mount Osutaka, Japan mountains
  monetization_risk: MED
  twist_potential: Задержка спасателей — могли выжить больше; культурно-политическая драма Японии
  sources:
  - Japan MLIT AAIC report
  - 'Admiral Cloudberg: "Chronicle of a Tragedy"'
  - BBC documentary "Flight 123"
  translation_status: partial
- name: Tenerife — Deadliest Aviation Accident
  section: DISASTER-LESSONS / TECHNICAL FAILURES
  date: 27 March 1977
  aircraft: KLM 747-206B (PH-BUF) + Pan Am 747-121 (N736PA)
  location: Los Rodeos Airport, Тенерифе, Канары
  failure_type: KLM начал разбег на runway без разрешения ATC; struck в Pan Am, which still выруливал along той же runway в in fog
  outcome: both aircraft сгорели; KLM completely, Pan Am partially
  casualties: 583 fatalities (all на KLM + большинство на Pan Am); 61 survivors с Pan Am
  dramatic_details:
  - both airframe диверсировали сюда после теракта в Las Palmas; airfield был перегружен
  - captain KLM Jacob van Zanten — the most уважаемый пилот компании, лицо рекламных плакатов
  - Ф/О said van Zanten про Pan Am впереди — тот проигнорировал
  - Радиопомехи (одновременная передача) сделали неоднозначным ответ ATC про clearance
  - incident дал старт CRM (Crew Resource Management) as дисциплине во всей отрасли
  sub_genre_primary: Human-factor tragedy
  sub_genre_secondary: ''
  causation_type: Human-Factor (CRM, ATC, fog)
