# ============================================================
# AI Story Generator Pro v1.0 — Default Settings
# ============================================================
# These are the canonical defaults.  User settings.yaml values
# override these on a per-key basis via deep merge.
# ============================================================

# --- Generation defaults ---
generation:
  tone: "dramatic_cinematic"
  perspective: "third_person"
  register: "conversational"
  pacing: "medium"
  audience: "all_ages"
  dialog_density: "medium"
  target_words: 3000
  structure: "three_act"
  genres:
    - "fantasy"
    - "mystery"
  min_score: 9.0
  max_attempts: 5
  # Minimum score improvement between consecutive evaluations to
  # justify another revision attempt.  If the score improves by less
  # than this threshold, the revision loop stops early (plateau
  # detection) to avoid wasting tokens on marginal gains.
  # Example: 8.5 → 8.6 → 8.5 → loop stops instead of retrying.
  min_score_improvement: 0.3
  # Voiceover-specific
  voiceover_optimized: true
  avoid_complex_sentences: true
  pause_markers: true
  no_headers: true
  no_meta_comments: true
  # Per-section quality gate (Fix #8):
  # After each section is generated, a free programmatic L1 check runs.
  # Sections with CRITICAL issues (chapter markers, meta-comments, encoding
  # errors) or a score below the internal threshold are regenerated up to
  # section_max_retries additional times.  The best result is always kept.
  # Set section_quality_check: false to disable entirely (not recommended).
  section_quality_check: true
  section_max_retries: 2

# --- API settings ---
api:
  primary_provider: "openrouter"
  primary_model: "anthropic/claude-3.5-sonnet"
  fallback_provider: "openai"
  fallback_model: "gpt-4o"
  auto_fallback: true
  max_retries: 3
  timeout_seconds: 120

  # Per-provider model configuration.
  # Each provider defines three model roles:
  #   primary    — main generation model (concept, outline, section, revision)
  #   fallback   — used when primary fails after retries
  #   evaluation — lighter/cheaper model for evaluation prompts
  models:
    openrouter:
      primary: "anthropic/claude-3.5-sonnet"
      fallback: "openai/gpt-4o"
      evaluation: "anthropic/claude-3-haiku"
    openai:
      primary: "gpt-4o"
      fallback: "gpt-4-turbo"
      evaluation: "gpt-4o-mini"
    anthropic:
      primary: "claude-3-5-sonnet-latest"
      fallback: "claude-3-5-haiku-latest"
      evaluation: "claude-3-5-haiku-latest"
    google:
      primary: "gemini-1.5-pro"
      fallback: "gemini-1.5-flash"
      evaluation: "gemini-1.5-flash"
    deepseek:
      primary: "deepseek-chat"
      fallback: "deepseek-chat"
      evaluation: "deepseek-chat"
    qwen:
      primary: "qwen-max"
      fallback: "qwen-plus"
      evaluation: "qwen-plus"

  # Provider-specific rate limits (max concurrent requests)
  rate_limits:
    openrouter: 5
    openai: 3
    anthropic: 2
    google: 5
    deepseek: 3
    qwen: 3

  # Pricing per 1M tokens (input / output) in USD
  pricing:
    "anthropic/claude-3.5-sonnet":
      input: 3.0
      output: 15.0
    "anthropic/claude-3-haiku":
      input: 0.25
      output: 1.25
    "openai/gpt-4o":
      input: 2.5
      output: 10.0
    "gpt-4o":
      input: 2.5
      output: 10.0
    "gpt-4-turbo":
      input: 10.0
      output: 30.0
    "gpt-4o-mini":
      input: 0.15
      output: 0.6
    "claude-3-5-sonnet-latest":
      input: 3.0
      output: 15.0
    "claude-3-5-sonnet-20241022":
      input: 3.0
      output: 15.0
    "claude-3-5-haiku-latest":
      input: 0.8
      output: 4.0
    "claude-3-opus-20240229":
      input: 15.0
      output: 75.0
    "gemini-1.5-pro":
      input: 1.25
      output: 5.0
    "gemini-1.5-flash":
      input: 0.075
      output: 0.3
    "deepseek-chat":
      input: 0.14
      output: 0.28
    "deepseek-coder":
      input: 0.14
      output: 0.28
    "qwen-max":
      input: 1.6
      output: 6.4
    "qwen-plus":
      input: 0.4
      output: 1.2
    "qwen-turbo":
      input: 0.1
      output: 0.3
    "deepseek/deepseek-chat":
      input: 0.14
      output: 0.28
    "qwen/qwen-max":
      input: 1.6
      output: 6.4
    "google/gemini-pro-1.5":
      input: 1.25
      output: 5.0
    "meta-llama/llama-3.1-405b":
      input: 3.0
      output: 3.0

# --- Retry settings ---
retry:
  initial_delay_seconds: 1.0
  max_delay_seconds: 16.0
  exponential_base: 2
  max_retries: 3

# --- Parallelism ---
parallelism:
  max_workers: 3
  auto_throttle: true
  separate_queues: true

# --- SSML export rules ---
ssml:
  paragraph_break: "600ms"
  scene_break: "1000ms"
  dialog_pause: "400ms"
  dramatic_pause: "800ms"
  sentence_pause: "200ms"
  slow_for_dramatic: true
  emphasis_for_key_words: false

# --- Logging ---
logging:
  level: "DEBUG"
  max_files: 10
  max_file_size_mb: 10
  log_dir: "logs"

# --- Paths ---
paths:
  output_dir: "output"
  data_dir: "data"
  resources_dir: "resources"
  recovery_dir: "data/recovery"
  cache_dir: "data/cache"
  analytics_dir: "data/analytics"

# --- Cache ---
cache:
  enabled: true
  skip_processed: true

# --- Strategy thresholds (word count) ---
strategy:
  single_shot_max: 2000
  two_pass_max: 4000
  # Above two_pass_max → full pipeline
