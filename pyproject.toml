[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-story-generator-pro"
version = "1.0.0"
description = "AI Story Generator Pro — Evergreen YouTube voiceover story generator with multi-provider LLM support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "AI Story Generator Team"},
]
keywords = ["ai", "story", "generator", "voiceover", "youtube", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    # GUI
    "customtkinter>=5.2.0",
    # API clients
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.4.0",
    # Text processing
    "langdetect>=1.0.9",
    "tiktoken>=0.6.0",
    # Export
    "lxml>=4.9.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0",
    # Data validation
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
story-generator = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "models*", "gui*", "exporters*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["core", "models", "exporters", "utils"]
omit = ["tests/*", "gui/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
